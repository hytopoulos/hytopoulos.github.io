<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // SPA redirect for GitHub Pages
      const l = window.location;
      const base = '/subsite/aemotion';
      const path = l.pathname.startsWith(base) ? l.pathname.slice(base.length) : l.pathname;
      l.replace(base + '/?p=' + encodeURIComponent(path + l.search + l.hash));
    </script>
  </head>
  <body>
  </body>
</html>
