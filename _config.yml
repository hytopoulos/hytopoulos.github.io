# Site settings
title: Theo Hytopoulos # site title
description: >- # site description
  Theo<a href="https://github.com/hytopoulos" target="_blank" rel="noopener">@github</a>.
lang: en-US # default lang
timezone: USA/Los_Angeles # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/hytopoulos/jekyll-klise # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Theo Hytopoulos # author name
  bio: >- # tell to the world
    Let's make AI accessible to everyone.
    <br>
    Check out my profile: <a href="https://github.com/hytopoulos" target="_blank" rel="noopener">@github</a>.
  username: hytopoulos # general username
  github: hytopoulos # github username
  twitter: hytopoulos # twitter username
  facebook: hytopoulos # facebook username
  email: theo.hytopoulos@gmail.com # email adress
  avatar: /assets/img/avatar.png # change with your own avatar

# URL settings
url: "https://hytopoulos.github.io" #
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
