name: Build and Deploy Jekyll

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Make Gemfile.lock valid for Linux runners
      - run: bundle lock --add-platform x86_64-linux

      - run: bundle install --without development

      # Build your site (custom plugins allowed)
      - run: bundle exec jekyll build --trace

      # --- Build React subsite at /subsite/aemotion ---
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install & build React app
        working-directory: ./subsite/aemotion-react
        run: |
          npm ci
          npm run build

      # Copy React dist to the place you want it to live on the site
      - name: Add React build to site
        run: |
          mkdir -p _site/subsite/aemotion
          cp -R aemotion-react/build/* _site/subsite/aemotion/

      # Add .nojekyll inside /subsite/aemotion to prevent Jekyll processing
      - run: touch _site/subsite/aemotion/.nojekyll

      # Required by GitHub Pages
      - uses: actions/configure-pages@v5

      # Upload the built site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
